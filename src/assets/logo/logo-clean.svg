<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE01B" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- Anillo exterior texturizado -->
    <circle cx="120" cy="120" r="110" fill="url(#ringGrad)" />
    <!-- Borde de precisión punteado -->
    <circle cx="120" cy="120" r="102" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.7" />
    <!-- Disco interior amarillo -->
    <circle cx="120" cy="120" r="90" fill="url(#yellowGrad)" />
    <circle cx="120" cy="120" r="90" fill="none" stroke="#d97706" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Letras S.R -->
  <g fill="#0f172a" font-family="'Outfit', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-style="italic">
    <text x="120" y="148" font-size="82" text-anchor="middle" letter-spacing="-2">S.R</text>
  </g>
</svg>