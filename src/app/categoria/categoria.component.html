<div class="categorias-container">
  <div class="main-layout">

    <div class="filter-panel">
      <h3 class="toggle-filter" (click)="toggleFilter()">
        Filtros
        <span *ngIf="isFilterOpen">&#9650;</span>
        <span *ngIf="!isFilterOpen">&#9660;</span>
      </h3>
      <div class="filter-group" *ngIf="isFilterOpen">
        <fieldset>
          <legend>Filtrar por letra:</legend>
          <ul>
            <li *ngFor="let type of availableTypes">
              <label>
                <input
                  type="checkbox"
                  [value]="type"
                  (change)="onCheckboxChange($event)"
                  id="{{ type }}"
                />
                <span>{{ type }}</span>
              </label>
            </li>
          </ul>
        </fieldset>
      </div>
    </div>

    <div class="content">
      <div class="title-card">
        <h1>Explora nuestras categorías</h1>
      </div>

      <div *ngIf="errorMessage">{{ errorMessage }}</div>
      <app-loading *ngIf="isLoading"></app-loading>

      <div *ngIf="!isLoading && (!filteredFamilies || filteredFamilies.length === 0)">
        <p>No se encontraron categorías.</p>
      </div>

      <section class="categories"
               *ngIf="!isLoading && filteredFamilies.length">
        <div class="category-card"
             *ngFor="let fam of filteredFamilies | slice:0:displayedCount">
          <h3>{{ fam.desfam }}</h3>
          <div>
            <img *ngIf="fam.imageUrl"
                 [src]="fam.imageUrl"
                 [alt]="'Imagen de ' + fam.desfam" />
            <img *ngIf="!fam.imageUrl"
                 src="assets/img/placeholder.png"
                 alt="Sin imagen" />
          </div>
          <button (click)="goToArticles(fam.codfam)">
            Ver Artículos
          </button>
        </div>
      </section>

      <div class="load-more"
           *ngIf="!isLoading && filteredFamilies.length > displayedCount">
        <button (click)="loadMore()">Ver más</button>
      </div>
    </div>
  </div>
</div>
