<div class="home-container">
  <h1>Familias</h1>
  
  <!-- Muestra el spinner mientras isLoading es true -->
  <app-loading *ngIf="isLoading"></app-loading>

  <!-- Si no se están cargando y hay familias, se muestran -->
  <section class="categories" *ngIf="!isLoading && families && families.length > 0">
    <div class="category-card" 
         *ngFor="let fam of families | slice:0:displayedCount">
      <h3>{{ fam.desfam }}</h3>
      <button (click)="goToArticles(fam.codfam)">Ver Artículos</button>
    </div>
  </section>

  <!-- Si ya cargó pero no hay familias, se muestra un mensaje -->
  <div *ngIf="!isLoading && (!families || families.length === 0)">
    <p>No se encontraron familias.</p>
  </div>

  <!-- Botón "Ver más" solo si quedan más familias por mostrar -->
  <div class="load-more" *ngIf="!isLoading && families && families.length > displayedCount">
    <button (click)="loadMore()">Ver más</button>
  </div>
</div>
