<div class="article-detail">
    <h2>{{ article.desart }}</h2>
    <img *ngIf="article.imgart" [src]="article.imgart" alt="{{ article.desart }}">
    <p><strong>Código:</strong> {{ article.codart }}</p>
    <p><strong>Precio:</strong> {{ article.pcoart | currency:'EUR':'symbol':'1.2-2' }}</p>
    <p><strong>EAN:</strong> {{ article.eanart }}</p>
    <p><strong>Familia:</strong> {{ article.famart }}</p>
    <p *ngIf="article.measure"><strong>Medida:</strong> {{ article.measure }}</p>
  </div>
