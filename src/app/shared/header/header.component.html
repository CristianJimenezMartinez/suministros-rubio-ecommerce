<header class="py-2 border-bottom">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <!-- Sección izquierda: Logo e items de navegación en escritorio -->
    <div class="header-left d-flex align-items-center">
      <!-- Botón de menú hamburguesa (solo en móvil) -->
      <button class="mobile-menu-toggle btn btn-link p-0 border-0" (click)="toggleNavDropdown()" aria-label="Abrir menú" *ngIf="isMobile">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-menu">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <!-- Logotipo de la marca original -->
      <a class="brand-logo d-flex align-items-center text-decoration-none" (click)="navigateTo('/')">
        <img src="assets/logo/logo.png" alt="Suministros Rubio" class="header-logo" />
      </a>

      <!-- Menú horizontal para ordenadores de escritorio -->
      <nav class="desktop-nav d-flex align-items-center" *ngIf="!isMobile">
        <a class="nav-link-item" (click)="navigateTo('/')">Inicio</a>
        <a class="nav-link-item" (click)="navigateTo('/categorias')">Categorías</a>
        <a class="nav-link-item" (click)="navigateTo('/articulos')">Productos</a>
      </nav>
    </div>

    <!-- Buscador en el centro -->
    <div class="search-bar">
      <div class="search-input-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" [(ngModel)]="searchText" placeholder="Buscar por producto, ref, modelo..."
               (keyup.enter)="onSearch()" />
        <button type="button" class="btn-clear-search" *ngIf="searchText" (click)="clearSearch()" aria-label="Borrar búsqueda">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <button type="button" class="btn-search-action" (click)="onSearch()" aria-label="Buscar">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </div>
    </div>

    <!-- Sección derecha: Carrito y Usuario -->
    <div class="right-section">
      <!-- Botón del carrito -->
      <div class="cart-container">
        <button class="cart-button" (click)="toggleCart()" aria-label="Carrito de compra">
          <div class="cart-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span class="badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
          </div>
          <span class="cart-label" *ngIf="!isMobile">Carrito</span>
        </button>
      </div>


      <!-- Sección del usuario -->
      <div class="user-section">
        <ng-container *ngIf="isLoggedIn; else notLoggedIn">
          <div class="dropdown">
            <!-- Botón de usuario con un SVG elegante -->
            <button class="user-button" (click)="toggleProfileDropdown()" aria-label="Menú de perfil">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" 
                  fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                  stroke-linejoin="round" class="icon icon-user">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </button>
            <!-- Dropdown del perfil integrado -->
            <ul class="dropdown-menu text-small shadow profile-dropdown"
                [ngClass]="{'show': isProfileDropdownOpen}"
                style="position: absolute; right: 0; left: auto; transform: translateY(8px); display: block;"
                *ngIf="isProfileDropdownOpen">
              <li><a class="dropdown-item" (click)="navigateToProfile()">Mi Perfil</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" (click)="logout()">Cerrar sesión</a></li>
            </ul>
          </div>
        </ng-container>
        <ng-template #notLoggedIn>
          <div class="desktop-user" *ngIf="!isMobile">
            <button class="btn btn-login" *ngIf="showLoginButton" (click)="onLoginClick()">Iniciar sesión</button>
            <button class="btn btn-register" *ngIf="showRegisterButton" (click)="onRegisterClick()">Registrarse</button>
          </div>
          <div class="mobile-user" *ngIf="isMobile">
            <a (click)="onMobileLoginClick()" aria-label="Iniciar sesión">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" 
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" class="icon icon-login-mobile">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                <polyline points="10 17 15 12 10 7"></polyline>
                <line x1="15" y1="12" x2="3" y2="12"></line>
              </svg>
            </a>
          </div>
        </ng-template>
      </div>


    </div>
  </div>

  <!-- Drawer lateral del carrito -->
  <app-cart *ngIf="isCartOpen" (close)="closeCart()"></app-cart>

  <!-- Sidenav lateral para móviles/tablets -->
  <div class="mobile-sidenav-overlay" [class.open]="isNavDropdownOpen" (click)="toggleNavDropdown()" *ngIf="isMobile"></div>
  
  <div class="mobile-sidenav" [class.open]="isNavDropdownOpen" *ngIf="isMobile">
    <div class="sidenav-header d-flex justify-content-between align-items-center px-3 py-3">
      <img src="assets/logo/logo.png" alt="Suministros Rubio" class="sidenav-logo" />
      <button class="close-btn btn btn-link p-0 border-0 text-white" (click)="toggleNavDropdown()" aria-label="Cerrar menú">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <nav class="sidenav-links d-flex flex-column px-4">
      <a (click)="navigateTo('/')">Inicio</a>
      <a (click)="navigateTo('/categorias')">Categorías</a>
      <a (click)="navigateTo('/articulos')">Productos</a>
      <hr class="sidenav-divider">
      <a (click)="navigateTo('/sobre-nosotros')">Sobre Nosotros</a>
      <a (click)="navigateTo('/contacto')">Contacto</a>
    </nav>
  </div>
</header>
