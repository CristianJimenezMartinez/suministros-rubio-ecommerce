<div class="checkout-container">
  <h2>Finalizar Compra</h2>
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="submitCheckout()" #checkoutForm="ngForm">
    <!-- Tipo de Cliente -->
    <div class="form-group">
      <label for="customerType">Tipo de cliente <span class="required-star">*</span>:</label>
      <select id="customerType" name="customerType" [(ngModel)]="shippingData.customerType" required>
        <option value="particular">Particular</option>
        <option value="empresa">Empresa / Autónomo</option>
      </select>
    </div>

    <!-- Razón Social / Nombre Comercial (solo si es Empresa/Autónomo) -->
    <div class="form-group" *ngIf="shippingData.customerType === 'empresa'">
      <label for="companyName">Razón Social / Nombre Comercial (opcional):</label>
      <input type="text" id="companyName" name="companyName" [(ngModel)]="shippingData.companyName" placeholder="Ej. Mi Empresa S.L.">
    </div>

    <!-- NIF / CIF / NIE Obligatorio -->
    <div class="form-group">
      <label for="nif">NIF / CIF / NIE <span class="required-star">*</span>:</label>
      <input type="text" id="nif" name="nif" [(ngModel)]="shippingData.nif" required placeholder="Ej. 12345678Z o B12345678">
    </div>

    <!-- Datos de Envío -->
    <div class="form-group">
      <label for="fullName">Nombre completo <span class="required-star">*</span>:</label>
      <input type="text" id="fullName" name="fullName" [(ngModel)]="shippingData.fullName" required>
    </div>
    <div class="form-group">
      <label for="address">Dirección <span class="required-star">*</span>:</label>
      <input type="text" id="address" name="address" [(ngModel)]="shippingData.address" required>
    </div>
    <div class="form-group">
      <label for="city">Ciudad <span class="required-star">*</span>:</label>
      <input type="text" id="city" name="city" [(ngModel)]="shippingData.city" required>
    </div>
    <div class="form-group">
      <label for="province">Provincia <span class="required-star">*</span>:</label>
      <input type="text" id="province" name="province" [(ngModel)]="shippingData.province" required>
    </div>
    <div class="form-group">
      <label for="postalCode">Código postal <span class="required-star">*</span>:</label>
      <input type="text" id="postalCode" name="postalCode" [(ngModel)]="shippingData.postalCode" required>
    </div>
    <div class="form-group">
      <label for="country">País <span class="required-star">*</span>:</label>
      <!-- Cambiado a select con solo "España" -->
      <select id="country" name="country"
              [(ngModel)]="shippingData.country"
              required>
        <option value="">Selecciona un país</option>
        <option value="España">España</option>
      </select>
    </div>
    <div class="form-group">
      <label for="phone">Teléfono <span class="required-star">*</span>:</label>
      <input type="tel" id="phone" name="phone" [(ngModel)]="shippingData.phone" required>
    </div>
    <div class="form-group">
      <label for="email">Email <span class="required-star">*</span>:</label>
      <input type="email" id="email" name="email" [(ngModel)]="shippingData.email" required>
    </div>

    <!-- Selección del Método de Envío -->
    <div class="form-group">
      <label>Método de Envío:</label>
      <select name="shippingMethod" [(ngModel)]="shippingMethod" (change)="onShippingMethodChange()">
        <option value="standard">Estándar (4-6 días) - 10 €</option>
        <option value="pickup">Recogida en tienda – Gratis</option>
      </select>
    </div>

    <!-- Resumen del Pedido -->
    <div class="order-summary">
      <h3>Resumen del Pedido</h3>
      <ul>
        <li *ngFor="let item of cartItems">
          {{ item.name }} – Cantidad: {{ item.quantity }} – Subtotal:
          {{ (item.price * item.quantity).toFixed(2) }} €
        </li>
      </ul>
      <p>Subtotal: {{ subtotal.toFixed(2) }} €</p>
      <p>Envío: {{ shippingCost.toFixed(2) }} €</p>
      <p>Total: {{ total.toFixed(2) }} €</p>
    </div>

    <div class="actions">
      <button type="button" (click)="cancel(); $event.stopPropagation()">Volver al Carrito</button>
      <button type="submit" [disabled]="checkoutForm.invalid">Realizar Compra</button>
    </div>
  </form>
</div>
