<!-- src/app/payment/payment.component.html -->
<app-loading *ngIf="processing"></app-loading>
<div class="payment" [class.dimmed]="processing">
  <div class="method-selector">
    <!-- PayPal (Método exclusivo) -->
    <div class="dropdown">
      <div class="dropdown-header active">
        <span>Pagar con PayPal</span>
      </div>
      <div class="dropdown-body">
        <div class="paypal-section">
          <div id="paypal-button-container"></div>
          <div class="actions">
            <button *ngIf="processing" disabled>Procesando...</button>
            <button *ngIf="!processing" type="button" (click)="onCancel()">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</div>
