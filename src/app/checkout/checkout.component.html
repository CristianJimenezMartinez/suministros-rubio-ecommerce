<div class="checkout-container">
    <h2>Finalizar Compra</h2>
    <form (ngSubmit)="submitOrder()" #checkoutForm="ngForm">
      <div class="form-group">
        <label for="fullName">Nombre completo:</label>
        <input id="fullName" type="text" name="fullName" [(ngModel)]="shippingData.fullName" required>
      </div>
      <div class="form-group">
        <label for="address">Dirección:</label>
        <input id="address" type="text" name="address" [(ngModel)]="shippingData.address" required>
      </div>
      <div class="form-group">
        <label for="city">Ciudad:</label>
        <input id="city" type="text" name="city" [(ngModel)]="shippingData.city" required>
      </div>
      <div class="form-group">
        <label for="postalCode">Código postal:</label>
        <input id="postalCode" type="text" name="postalCode" [(ngModel)]="shippingData.postalCode" required>
      </div>
      <div class="form-group">
        <label for="country">País:</label>
        <input id="country" type="text" name="country" [(ngModel)]="shippingData.country" required>
      </div>
      <div class="form-group">
        <label for="phone">Teléfono:</label>
        <input id="phone" type="tel" name="phone" [(ngModel)]="shippingData.phone" required>
      </div>
      <!-- Aquí podrías agregar un resumen del pedido -->
      <div class="order-summary">
        <h3>Resumen del Pedido</h3>
        <ul>
          <li *ngFor="let item of cartItems">
            {{ item.name }} – Cantidad: {{ item.quantity }} – Subtotal: {{ item.price * item.quantity | currency:'EUR':'symbol':'1.2-2' }}
          </li>
        </ul>
        <p class="total">Total: {{ total | currency:'EUR':'symbol':'1.2-2' }}</p>
      </div>
      <button type="submit" [disabled]="checkoutForm.invalid">Realizar Compra</button>
    </form>
  </div>
